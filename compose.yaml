# Local development database. `./mvnw spring-boot:run` starts this automatically (spring-boot-docker-compose).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: spendwitz
      POSTGRES_USER: spendwitz
      POSTGRES_PASSWORD: spendwitz
    ports:
      - "5432:5432"
    volumes:
      - spendwitz-data:/var/lib/postgresql/data

volumes:
  spendwitz-data:
