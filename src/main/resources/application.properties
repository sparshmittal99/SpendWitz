spring.application.name=spendwitz

# Local secrets live in .env (gitignored). In production these come from real environment variables.
spring.config.import=optional:file:.env[.properties]

# --- Database (PostgreSQL + pgvector) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/spendwitz}
spring.datasource.username=${DATABASE_USERNAME:spendwitz}
spring.datasource.password=${DATABASE_PASSWORD:spendwitz}
spring.datasource.hikari.maximum-pool-size=3
# Let idle connections close so a serverless DB (Neon) can scale to zero
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
# pgvector: keep scanning the HNSW index until enough rows pass the per-user filter (pgvector 0.8+)
spring.datasource.hikari.connection-init-sql=SET hnsw.iterative_scan = relaxed_order; SET hnsw.ef_search = 100
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Gemini (free tier) ---
spring.ai.google.genai.api-key=${GEMINI_API_KEY:missing}
# Flash-Lite: highest free-tier daily limit. Pinned version, so behaviour doesn't change under the demo.
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.temperature=0.2
# Gemini 3 models think hard by default, and the assistant makes several model calls per question (tools, then the
# answer), so high thinking left users staring at the typing dots. Low keeps tool use accurate and answers quick.
spring.ai.google.genai.chat.thinking-level=${GEMINI_THINKING_LEVEL:low}
# Spring AI's default is 10 attempts with waits growing to 3 minutes. Fail fast instead: ResilientChat then moves
# on to the fallback model.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=5s
# Used automatically when the main model is overloaded (503) or rate-limited (429). Free-tier quotas are per model,
# so a different model also adds spare daily capacity.
spendwitz.ai.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.1-flash-lite}
# Optional: the assistant chat uses Groq (much faster replies) when GROQ_API_KEY is set, and falls back to Gemini
# if Groq fails. GROQ_MODEL overrides the default model (it must support tool use). Bill scanning (images) and
# everything else stay on Gemini.
spendwitz.ai.groq.api-key=${GROQ_API_KEY:}
spendwitz.ai.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
spendwitz.ai.groq.base-url=https://api.groq.com/openai/v1
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:missing}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.google.genai.embedding.text.task-type=SEMANTIC_SIMILARITY

# --- Vector store: table is created by Flyway (V1), not by Spring AI ---
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine-distance

# --- Web ---
spring.servlet.multipart.max-file-size=6MB
# Several bills (up to 8) or statements (up to 4) can be uploaded together
spring.servlet.multipart.max-request-size=30MB
server.forward-headers-strategy=framework
server.compression.enabled=true
# Streamed assistant answers: longer than the AssistantController timeout, so users get its friendly message
spring.mvc.async.request-timeout=120s
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health
# /actuator/health/liveness doesn't touch the DB: use it for uptime pings
management.endpoint.health.probes.enabled=true

# --- App ---
spendwitz.zone=Asia/Kolkata
spendwitz.demo.enabled=true
spendwitz.demo.email=demo@spendwitz.app
spendwitz.demo.password=demo1234
