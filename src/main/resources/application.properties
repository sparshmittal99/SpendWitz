spring.application.name=spendsense

# Local secrets live in .env (gitignored). In production these come from real environment variables.
spring.config.import=optional:file:.env[.properties]

# --- Database (PostgreSQL + pgvector) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/spendsense}
spring.datasource.username=${DATABASE_USERNAME:spendsense}
spring.datasource.password=${DATABASE_PASSWORD:spendsense}
spring.datasource.hikari.maximum-pool-size=5
# Let idle connections close so a serverless DB (Neon) can scale to zero
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
# pgvector: keep scanning the HNSW index until enough rows pass the per-user filter (pgvector 0.8+)
spring.datasource.hikari.connection-init-sql=SET hnsw.iterative_scan = relaxed_order; SET hnsw.ef_search = 100
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Gemini (free tier) ---
spring.ai.google.genai.api-key=${GEMINI_API_KEY:missing}
# Flash-Lite: highest free-tier daily limit. Pinned version, so behaviour doesn't change under the demo.
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.temperature=0.2
# Used automatically when the main model is overloaded (503) or rate-limited (429). Free-tier quotas are per model,
# so a different model also adds spare daily capacity.
spendsense.ai.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.1-flash-lite}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:missing}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.google.genai.embedding.text.task-type=SEMANTIC_SIMILARITY

# --- Vector store: table is created by Flyway (V1), not by Spring AI ---
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine-distance

# --- Web ---
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
server.forward-headers-strategy=framework
server.compression.enabled=true
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health
# /actuator/health/liveness doesn't touch the DB: use it for uptime pings
management.endpoint.health.probes.enabled=true

# --- App ---
spendsense.zone=Asia/Kolkata
# Free-tier protection: AI actions allowed per user per day, and across the whole app per day.
# Gemini's free tier allows ~500 model requests/day and one action can take 2-4 requests
# (the assistant calls tools before answering), so the app-wide cap is kept well below that.
spendsense.ai.daily-limit-per-user=20
spendsense.ai.daily-limit-demo=100
spendsense.ai.daily-limit-global=150
spendsense.demo.enabled=true
spendsense.demo.email=demo@spendsense.app
spendsense.demo.password=demo1234
