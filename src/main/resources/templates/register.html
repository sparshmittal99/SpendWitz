<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign up')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('register')}"></nav>

<main class="container">
    <div class="auth-card card p-4">
        <h4 class="fw-bold mb-3">Create your account</h4>
        <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
            <div class="mb-3">
                <label for="displayName" class="form-label">Name</label>
                <input type="text" th:field="*{displayName}" class="form-control" th:errorclass="is-invalid" required>
                <div class="invalid-feedback" th:errors="*{displayName}"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" required autocomplete="username">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid" required autocomplete="new-password">
                <div class="form-text">At least 8 characters.</div>
                <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>
            <div class="mb-4">
                <label for="currency" class="form-label">Currency</label>
                <select th:field="*{currency}" class="form-select">
                    <option value="INR">₹ Indian Rupee (INR)</option>
                    <option value="USD">$ US Dollar (USD)</option>
                    <option value="EUR">€ Euro (EUR)</option>
                    <option value="GBP">£ British Pound (GBP)</option>
                </select>
            </div>
            <button class="btn btn-primary w-100" type="submit">Create account</button>
        </form>
        <p class="small text-secondary mt-3 mb-0">Already have an account? <a href="/login">Log in</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
